name: lantern
description: "LANtern - A local-first social hub for LAN communication without internet."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Networking
  network_info_plus: ^5.0.0
  wifi_iot: ^0.3.22
  multicast_dns: ^0.3.0

  # Database
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0

  # Storage
  shared_preferences: ^2.2.0

  # UI
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.0
  google_fonts: ^6.1.0

  # File handling
  file_picker: ^6.1.0
  permission_handler: ^11.4.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  image: ^4.1.0
  equatable: ^2.0.0

  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
